# heavnd.com — landing estática, sin backend. www.heavnd.com redirige a la raíz.
# setup-vps.sh copia este fichero y sustituye las líneas __TLS__ si encuentra certificado.

# Markdown for Agents: una petición con `Accept: text/markdown` recibe el index.md que genera el build
# (scripts/markdown.mjs) en la misma URL. Sin esa cabecera, el HTML de siempre.
map $http_accept $heavnd_markdown {
    default 0;
    "~*text/markdown" 1;
}

server {
    listen 80;
    listen [::]:80;
    # __TLS__
    server_name www.heavnd.com;
    # Solo HTTPS durante 6 meses. nginx no hereda add_header donde un location define los suyos: se repite abajo.
    add_header Strict-Transport-Security "max-age=15552000" always;

    # www también tiene que validar con Let's Encrypt: va en el mismo certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://heavnd.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    # __TLS__
    server_name heavnd.com;
    # Solo HTTPS durante 6 meses. nginx no hereda add_header donde un location define los suyos: se repite abajo.
    add_header Strict-Transport-Security "max-age=15552000" always;

    root /srv/heavnd/web;
    index index.html;

    # Compresión en origen (Cloudflare la mantiene o la pasa a Brotli): HTML, CSS, JS, JSON, SVG y XML.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/css application/javascript application/json application/xml application/manifest+json image/svg+xml text/plain;

    # Redirecciones con Location relativa: detrás de Cloudflare nginx no sabe si el visitante llegó por https.
    absolute_redirect off;

    # Una sola URL por página: /choosd/, /choosd/index.html e /index.html redirigen a la forma sin barra
    # final, que es la canónica y la del sitemap. Evita contenido duplicado y concentra los enlaces.
    # Resolvd pasó a llamarse Choosd: las páginas antiguas (/resolvd, /en/resolvd, /ca/resolvd, con o sin
    # barra) redirigen para siempre a las nuevas en un solo salto. Va antes que la regla de la barra final.
    rewrite ^/(en/|ca/)?resolvd/?$ /$1choosd permanent;
    rewrite ^/index\.html$ / permanent;
    rewrite ^(/.+?)/(index\.html)?$ $1 permanent;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Assets con hash en el nombre: caché larga.
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri =404;
    }

    # Portada y páginas de cada app (/choosd, /en/meald…) son HTML estático en <ruta>/index.html.
    # $uri/index.html en lugar de $uri/: así /choosd se sirve tal cual, sin el 301 a /choosd/, y coincide
    # con la canónica y el sitemap. Lo que no existe es un 404 de verdad (no una redirección a la portada,
    # que Google trata como soft 404 y que hace parecer válida cualquier URL).

    # Imágenes de vista previa e iconos: nombres estables, caché de una semana.
    location ~ ^/(og/|icon-|apple-touch-icon|favicon) {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
        add_header Strict-Transport-Security "max-age=15552000" always;
        try_files $uri =404;
    }

    # Las páginas de error y el shell SPA que genera Nuxt no son páginas: no se sirven por su nombre.
    location = /404.html { internal; }
    location = /200.html { return 404; }

    # Versión Markdown de una página (solo rutas sin extensión: /, /choosd, /en/meald/weekly-meal-planner).
    location ^~ /__markdown/ {
        internal;
        rewrite ^/__markdown(/.*?)/?$ $1/index.md break;
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
        add_header Cache-Control "no-cache";
        add_header Vary Accept always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }

    location / {
        if ($heavnd_markdown) {
            rewrite "^(/[^.]*)$" /__markdown$1 last;
        }
        add_header Vary Accept always;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
