# heavnd.com — landing estática, sin backend. www.heavnd.com redirige a la raíz.
# setup-vps.sh copia este fichero y sustituye las líneas __TLS__ si encuentra certificado.

server {
    listen 80;
    listen [::]:80;
    # __TLS__
    server_name www.heavnd.com;

    # www también tiene que validar con Let's Encrypt: va en el mismo certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://heavnd.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    # __TLS__
    server_name heavnd.com;

    root /srv/heavnd/web;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Assets con hash en el nombre: caché larga.
    location /_nuxt/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Portada y páginas de cada app (/resolvd, /en/meald…) son HTML estático en <ruta>/index.html.
    # $uri/index.html en lugar de $uri/: así /resolvd se sirve tal cual, sin el 301 a /resolvd/, y coincide
    # con la canónica y el sitemap. Lo que no existe es un 404 de verdad (no una redirección a la portada,
    # que Google trata como soft 404 y que hace parecer válida cualquier URL).
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
}
